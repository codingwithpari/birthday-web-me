<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Pari ❤️</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Sparkles -->
    <div class="sparkle" style="top:15%; left:15%;"></div>
    <div class="sparkle" style="top:25%; left:80%; animation-delay:.5s;"></div>
    <div class="sparkle" style="top:70%; left:10%; animation-delay:1s;"></div>
    <div class="sparkle" style="top:80%; left:85%; animation-delay:1.5s;"></div>
    <div class="sparkle" style="top:12%; left:55%; animation-delay:.8s;"></div>


    <!-- Main Card -->
    <div class="card">

        <div class="small-text">
            A Special Day ✨
        </div>

        <h1>
            Happy Birthday
        </h1>

        <div class="name">
            Pari ❤️
        </div>

        <p class="message">
            Wishing you a beautiful birthday filled with
            happiness, laughter, amazing memories and
            lots of wonderful moments. ✨🎂
        </p>

        <button onclick="showSurprise()">
            Open Your Surprise 🎁
        </button>

        <div id="surprise">
            ✨ May your every dream come true! ✨
            <br>
            Keep smiling and keep shining ❤️
        </div>

    </div>


    <!-- JavaScript -->
    <script>

        function showSurprise() {

            const surprise = document.getElementById("surprise");

            surprise.style.display = "block";

            createHearts(25);
        }


        function createHearts(amount) {

            for (let i = 0; i < amount; i++) {

                const heart = document.createElement("div");

                heart.classList.add("heart");

                heart.innerHTML =
                    ["❤️", "💖", "💕", "✨", "💗"]
                    [Math.floor(Math.random() * 5)];

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.animationDuration =
                    (4 + Math.random() * 4) + "s";

                heart.style.fontSize =
                    (16 + Math.random() * 20) + "px";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 8000);
            }
        }


        /* Automatic Floating Hearts */

        setInterval(() => {
            createHearts(1);
        }, 1200);

    </script>

</body>

</html>
